# `docker compose up --build` brings up a working, seeded application with no
# external dependencies: a database, the API, and the client behind nginx.
#
# The only thing you must supply is JWT_SECRET, in a .env file next to this one.
# Copy .env.example and fill it in — every other key here has a working default.

services:
  mongo:
    # Pinned to the same major as the mongod the tests run against
    # (apps/api/tests/setup.ts), so tests and deployment agree.
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The API waits for this rather than retrying a connection in a loop.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/iitk-autowala
      # No default, on purpose: an unset or empty JWT_SECRET stops compose here
      # with this message rather than starting something with a guessable key.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — generate one with `openssl rand -base64 48`}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      AVAILABILITY_TTL_MINUTES: ${AVAILABILITY_TTL_MINUTES:-45}
      DEFAULT_SEARCH_RADIUS_METERS: ${DEFAULT_SEARCH_RADIUS_METERS:-5000}
      MAX_NEARBY_RESULTS: ${MAX_NEARBY_RESULTS:-20}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  mongo-data:
